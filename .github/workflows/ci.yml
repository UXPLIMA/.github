name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/uxm-ci.yml
    permissions:
      contents: read
    with:
      runner: '["ubuntu-latest"]'
      gradle: false
      scopes: "standard conventions workspace tools ci profile"
      tools-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools -p "test_*.py"
